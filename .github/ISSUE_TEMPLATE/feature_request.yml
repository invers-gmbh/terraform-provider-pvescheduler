name: Feature request
description: Suggest a change or addition to the provider
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This provider is a best-effort node placement helper, not a load balancer.
        Requests that would turn it into one are unlikely to be accepted, but we
        are happy to discuss the underlying problem.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not just the feature you have in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like the provider to do?
      description: If you have a configuration in mind, sketch it here.
      render: hcl
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
    validations:
      required: false
